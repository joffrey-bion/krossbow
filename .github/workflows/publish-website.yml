name: publish-website

on:
  workflow_dispatch: {}
  push:
    tags:
      - '*'

run-name: "Website update (${{ github.ref_name }})"

permissions:
  contents: write # to push to the gh-pages branch

jobs:
  publish-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to fetch all tags for proper version

      - name: Set up JDK ${{ matrix.jdk-version }}
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Generate KDocs
        run: ./gradlew generateWebsiteKDocs

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install Zensical
        run: pip install zensical

      - name: Build website
        # --strict aborts on any warning (broken links, undefined variables, ...)
        run: |
          cd docs
          zensical build --strict

      - name: Deploy doc to GitHub pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/site
          publish_branch: gh-pages
          force_orphan: true # keep a single commit on gh-pages (mirrors `mkdocs gh-deploy --force`)
